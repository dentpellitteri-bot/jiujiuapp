<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks App</title>

<link href="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display";
    transition:0.3s;
}

/* 主题 */
body.light{background:#f5f5f7;color:#111;}
body.dark{background:#000;color:#fff;}

header{
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

button{
    border:none;
    padding:10px 14px;
    border-radius:12px;
    cursor:pointer;
}

.addBtn{
    background:#007aff;
    color:white;
}

/* 分类 */
.board{
    padding:15px;
}

.section{
    border-radius:16px;
    margin-bottom:12px;
    padding:12px;
    background:rgba(120,120,120,0.1);
}

.title{
    display:flex;
    justify-content:space-between;
    cursor:pointer;
    font-weight:bold;
}

.tasks{
    margin-top:10px;
    display:none;
}

/* task */
.task{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px;
    margin:8px 0;
    border-radius:12px;
    background:rgba(120,120,120,0.15);
    font-size:14px;
}

.task.done{
    text-decoration:line-through;
    opacity:0.5;
}

.left{
    display:flex;
    gap:10px;
    align-items:center;
}

.small{
    font-size:12px;
    opacity:0.7;
}

/* modal */
.modal{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.4);
    display:none;
    justify-content:center;
    align-items:center;
}

.box{
    background:white;
    padding:20px;
    border-radius:16px;
    width:280px;
}

.box input,select{
    width:100%;
    margin:6px 0;
    padding:8px;
    border-radius:10px;
    border:1px solid #ddd;
}
</style>
</head>

<body class="light">

<header>
    <h3>📋 Tasks</h3>
    <button class="addBtn" onclick="openModal()">＋ 添加任务</button>
</header>

<div class="board">

    <div class="section">
        <div class="title" onclick="toggle('work')">🟦 工作</div>
        <div class="tasks" id="work"></div>
    </div>

    <div class="section">
        <div class="title" onclick="toggle('life')">🟩 生活</div>
        <div class="tasks" id="life"></div>
    </div>

    <div class="section">
        <div class="title" onclick="toggle('important')">🟥 重要</div>
        <div class="tasks" id="important"></div>
    </div>

    <div class="section">
        <div class="title" onclick="toggle('todo')">🟨 待办</div>
        <div class="tasks" id="todo"></div>
    </div>

</div>

<!-- modal -->
<div class="modal" id="modal">
    <div class="box">
        <h4>添加任务</h4>

        <select id="cat">
            <option value="work">工作</option>
            <option value="life">生活</option>
            <option value="important">重要</option>
            <option value="todo">待办</option>
        </select>

        <input id="text" placeholder="任务内容">
        <input id="date" type="date">
        <input id="time" type="time">

        <button onclick="addTask()">保存</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<script>

let data = JSON.parse(localStorage.getItem("tasks") || "{}");

// 🌗 自动主题
function setTheme(){
    if(window.matchMedia("(prefers-color-scheme: dark)").matches){
        document.body.className="dark";
    }
}
setTheme();

// 📦 折叠
function toggle(id){
    let el=document.getElementById(id);
    el.style.display = el.style.display==="block"?"none":"block";
}

// ➕ 打开弹窗
function openModal(){
    document.getElementById("modal").style.display="flex";
}

// ❌ 关闭
document.getElementById("modal").onclick=function(e){
    if(e.target===this)this.style.display="none";
}

// ➕ 添加任务
function addTask(){
    let cat=document.getElementById("cat").value;
    let text=document.getElementById("text").value;
    let date=document.getElementById("date").value;
    let time=document.getElementById("time").value;

    if(!text)return;

    let task={
        id:Date.now(),
        text,
        date,
        time,
        done:false
    };

    if(!data[cat])data[cat]=[];
    data[cat].push(task);

    save();
    render();

    document.getElementById("modal").style.display="none";
}

// ✔ 完成
function done(cat,id){
    let t=data[cat].find(x=>x.id==id);
    t.done=!t.done;
    save();render();
}

// 🗑 删除
function del(cat,id){
    data[cat]=data[cat].filter(x=>x.id!=id);
    save();render();
}

// 💾 保存
function save(){
    localStorage.setItem("tasks",JSON.stringify(data));
}

// 📦 渲染
function render(){
    for(let cat in data){
        let box=document.getElementById(cat);
        if(!box)continue;

        box.innerHTML="";

        data[cat].forEach(t=>{
            let div=document.createElement("div");
            div.className="task"+(t.done?" done":"");

            div.innerHTML=`
                <div class="left">
                    <input type="checkbox" ${t.done?"checked":""} onclick="done('${cat}',${t.id})">
                    <div>
                        <div>${t.text}</div>
                        <div class="small">${t.date||""} ${t.time||""}</div>
                    </div>
                </div>
                <button onclick="del('${cat}',${t.id})">🗑</button>
            `;

            box.appendChild(div);
        });

        // 拖拽
        new Sortable(box,{
            animation:150,
            onEnd:function(){
                let newArr=[];
                box.querySelectorAll(".task").forEach(el=>{
                    let text=el.innerText.trim();
                    let t=data[cat].find(x=>text.includes(x.text));
                    if(t)newArr.push(t);
                });
                data[cat]=newArr;
                save();
            }
        });
    }
}

render();

</script>

</body>
</html>
