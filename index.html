<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V9 AI终极任务系统</title>

<style>
:root{
  --bg1:#0f172a;
  --bg2:#1e293b;
  --card:rgba(255,255,255,0.08);
  --text:#fff;
  --blue:#3b82f6;
  --green:#22c55e;
  --red:#ef4444;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont;
  background:linear-gradient(120deg,var(--bg1),var(--bg2));
  color:var(--text);
}

/* 顶部 */
.header{
  padding:18px;
  font-size:20px;
  font-weight:600;
}

/* 卡片 */
.card{
  margin:10px;
  padding:14px;
  border-radius:16px;
  background:var(--card);
  backdrop-filter:blur(12px);
  transition:0.25s cubic-bezier(.2,.8,.2,1);
  user-select:none;
}

.card:active{
  transform:scale(0.96);
}

/* 删除动画 */
.card.del{
  transform:translateX(-120px);
  opacity:0;
}

/* 完成 */
.done{
  background:rgba(34,197,94,0.3);
  text-decoration:line-through;
}

/* FAB */
.fab{
  position:fixed;
  right:20px;
  bottom:25px;
  width:64px;
  height:64px;
  border-radius:50%;
  background:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

/* 面板 */
.panel{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  padding:12px;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
}

input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  outline:none;
}

button{
  width:100%;
  margin-top:8px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:var(--blue);
  color:white;
}
</style>

</head>

<body>

<div class="header">🧠 V9 AI终极任务系统</div>

<div id="list"></div>

<div class="fab" onclick="toggle()">🎤</div>

<div class="panel" id="panel" style="display:none">
  <input id="text" placeholder="说话或输入任务（AI自动识别）">
  <button onclick="add()">生成任务</button>
</div>

<script>

/* ========= 数据 ========= */
let data = JSON.parse(localStorage.getItem("v9") || "[]");

/* ========= AI解析 ========= */
function aiParse(text){

  let task = {
    text,
    time:null,
    cat:"待办",
    priority:1,
    done:false
  };

  // 时间识别
  if(text.includes("明天")){
    let d=new Date();
    d.setDate(d.getDate()+1);
    task.time=d.toISOString().slice(0,16);
  }

  if(text.includes("今天")){
    task.time=new Date().toISOString().slice(0,16);
  }

  // 分类
  if(/开会|工作|客户|报告/.test(text)) task.cat="工作";
  if(/吃|买|超市|家/.test(text)) task.cat="生活";
  if(/重要|紧急/.test(text)) task.priority=10;

  return task;
}

/* ========= 保存 ========= */
function save(){
  localStorage.setItem("v9",JSON.stringify(data));
  render();
}

/* ========= 渲染 ========= */
function render(){

  let list=document.getElementById("list");
  list.innerHTML="";

  // AI排序（时间优先）
  data.sort((a,b)=>{
    return (a.time||"9999") > (b.time||"9999") ? 1 : -1;
  });

  data.forEach((t,i)=>{

    let div=document.createElement("div");
    div.className="card "+(t.done?"done":"");

    div.innerHTML=`
      <div style="font-size:16px">${t.text}</div>
      <div style="opacity:0.6;font-size:12px">
        ${t.cat} · ${t.time || "无时间"} · P${t.priority}
      </div>
    `;

    /* 点击完成 */
    div.onclick=()=>{
      t.done=!t.done;
      save();
    };

    /* 左滑删除 */
    let startX=0;

    div.addEventListener("touchstart",(e)=>{
      startX=e.touches[0].clientX;
    });

    div.addEventListener("touchend",(e)=>{
      let diff=e.changedTouches[0].clientX-startX;

      if(diff<-80){
        div.classList.add("del");
        setTimeout(()=>{
          data.splice(i,1);
          save();
        },200);
      }
    });

    list.appendChild(div);
  });
}

/* ========= 添加 ========= */
function add(){

  let text=document.getElementById("text").value;
  if(!text)return;

  let task=aiParse(text);
  data.push(task);

  document.getElementById("text").value="";
  save();
}

/* ========= UI ========= */
function toggle(){
  let p=document.getElementById("panel");
  p.style.display=p.style.display==="none"?"block":"none";
}

render();

</script>

</body>
</html>
