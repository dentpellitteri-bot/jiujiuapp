<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提醒事项</title>

<style>
:root{
  --bg:#f5f5f7;
  --card:#fff;
  --text:#111;
  --sub:#666;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b0b0f;
    --card:#1c1c1e;
    --text:#fff;
    --sub:#aaa;
  }
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont;
  background:var(--bg);
  color:var(--text);
}

/* 顶部 */
.header{
  padding:18px;
  font-size:22px;
  font-weight:600;
}

/* 板块 */
.board{
  padding:10px 15px 120px;
}

.category{
  background:var(--card);
  border-radius:16px;
  padding:12px;
  margin-bottom:12px;
}

.cat-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:600;
}

.tag{
  width:10px;height:10px;border-radius:50%;
  display:inline-block;
  margin-right:8px;
}

.task{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  font-size:14px;
  border-bottom:1px solid rgba(0,0,0,0.05);
}

.task.done{
  text-decoration:line-through;
  opacity:0.5;
}

/* FAB */
.fab{
  position:fixed;
  right:20px;
  bottom:30px;
  width:60px;
  height:60px;
  border-radius:50%;
  background:#007aff;
  color:#fff;
  font-size:34px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* 弹窗 */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  display:none;
  justify-content:center;
  align-items:center;
}

.panel{
  background:var(--card);
  width:320px;
  padding:15px;
  border-radius:12px;
}

input,select{
  width:100%;
  padding:8px;
  margin-top:8px;
}

/* 长按菜单 */
.colorPicker{
  display:none;
  margin-top:8px;
}
</style>
</head>

<body>

<div class="header">📌 提醒事项</div>
<div class="board" id="board"></div>

<div class="fab" onclick="openModal()">+</div>

<!-- 添加 -->
<div class="modal" id="modal">
  <div class="panel">
    <div>新建提醒</div>

    <select id="catSelect"></select>

    <input id="text" placeholder="内容"/>

    <input id="time" type="datetime-local"/>
    <small>不填 = 无时间提醒</small>

    <button onclick="addTask()">添加</button>
  </div>
</div>

<script>

/* ====== 强制默认数据（解决你看不到4个板块的问题）====== */
let data = {
  cats:[
    {name:"工作",color:"#007aff",tasks:[]},
    {name:"生活",color:"#34c759",tasks:[]},
    {name:"重要",color:"#ff3b30",tasks:[]},
    {name:"待办",color:"#ff9500",tasks:[]}
  ]
};

/* 如果本地有数据则覆盖 */
const saved = localStorage.getItem("data");
if(saved) data = JSON.parse(saved);

function save(){
  localStorage.setItem("data",JSON.stringify(data));
  render();
}

/* 渲染 */
function render(){
  const board = document.getElementById("board");
  board.innerHTML="";

  data.cats.forEach((c,i)=>{

    const div = document.createElement("div");
    div.className="category";

    div.innerHTML=`
      <div class="cat-title"
        oncontextmenu="editColor(${i});return false;">
        <span>
          <span class="tag" style="background:${c.color}"></span>
          ${c.name}
        </span>
      </div>
    `;

    c.tasks.forEach((t,ti)=>{
      const el = document.createElement("div");
      el.className="task "+(t.done?"done":"");

      el.innerHTML=`
        <span onclick="toggle(${i},${ti})">
          ${t.text}
          ${t.time ? "<small style='color:#999'> · "+t.time+"</small>" : ""}
        </span>
        <span onclick="del(${i},${ti})">🗑</span>
      `;

      div.appendChild(el);
    });

    board.appendChild(div);
  });

  updateSelect();
}

/* ====== 添加任务（支持时间可选）====== */
function addTask(){
  const i = document.getElementById("catSelect").value;
  const text = document.getElementById("text").value;
  const time = document.getElementById("time").value;

  if(!text) return;

  data.cats[i].tasks.push({
    text,
    time: time || null,
    done:false
  });

  document.getElementById("modal").style.display="none";
  save();
}

/* 完成 */
function toggle(i,ti){
  data.cats[i].tasks[ti].done = !data.cats[i].tasks[ti].done;
  save();
}

/* 删除 */
function del(i,ti){
  data.cats[i].tasks.splice(ti,1);
  save();
}

/* 下拉 */
function updateSelect(){
  const sel = document.getElementById("catSelect");
  sel.innerHTML="";
  data.cats.forEach((c,i)=>{
    const op=document.createElement("option");
    op.value=i;
    op.textContent=c.name;
    sel.appendChild(op);
  });
}

/* 打开 */
function openModal(){
  document.getElementById("modal").style.display="flex";
}

/* ====== 长按改颜色 ====== */
function editColor(i){
  const color = prompt("输入颜色代码，例如 #ff0000", data.cats[i].color);
  if(color){
    data.cats[i].color = color;
    save();
  }
}

render();

</script>

</body>
</html>
